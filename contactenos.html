<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contactenos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="estilo.css">
  </head>
  <body>
    <header>
      <div class="container p-0" id="header-cont">
        <nav class="navbar navbar-expand-lg bg-body-tertiary menu p-0" >
          <div class="container-fluid" id="navbar">
            <a class="navbar-brand" href="./index.html">Plaza Sabores</a>
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNavAltMarkup"
              aria-controls="navbarNavAltMarkup"
              aria-expanded="false"
              aria-label="Toggle navigation"
              id="btn-responsive"
            >
              <span class="navbar-toggler-icon icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
              <div class="navbar-nav">
                <a
                  class="nav-link active"
                  aria-current="page"
                  id="navlink"
                  href="./index.html"
                  >Home</a
                >
                <a class="nav-link" id="navlink" href="./productos.html">Productos</a>
                <a class="nav-link" id="navlink" href="./contactenos.html">Contactenos</a>
              </div>
            </div>
          </div>
        </nav>
      </div>
    </header>
    <main>
      <section>
        <div class="card text-center">
          <div class="card-body" id="titulo-productos">
            <div id="contenedorTexto">
              <h5 class="card-title">Contactenos</h5>
                <p class="card-text">
                  Para realizar sus pedidos o registrar cualquier solicitud por favor diligencie los siguientes datos.
                </p>
            </div>            
          </div>
      </section>

      <section id="formSection">
        <div class="container text-center">
          <div class="row">
            <div class="col-sm"></div>
            <div class="col-sm-7">
              <div class="formCont formularioCont">
                <form class="row g-3">
                  <div class="col-md-6">
                    <label for="inputEmail4" class="form-label labelInputs">Nombres</label>
                    <input type="email" class="form-control" id="inputEmail4">
                  </div>
                  <div class="col-md-6">
                    <label for="inputPassword4" class="form-label labelInputs">Apellidos</label>
                    <input type="password" class="form-control" id="inputPassword4">
                  </div>
                  <div class="col-md-6">
                    <label for="inputEmail4" class="form-label labelInputs">Correo electronico</label>
                    <input type="email" class="form-control" id="inputEmail4">
                  </div>
                  <div class="col-md-6">
                    <label for="inputPassword4" class="form-label labelInputs">Telefono</label>
                    <input type="password" class="form-control" id="inputPassword4">
                  </div>
                  <div class="col-md-12">
                    <label for="inputState" class="form-label labelInputs">Puesto de interes</label>
                    <select id="inputState" class="form-select">
                      <option selected>Seleccione una opcion</option>
                      <option>Cafe</option>
                      <option>Frutas</option>
                      <option>Jugos Naturales</option>
                      <option>Panaderia</option>
                      <option>Restaurante</option>                                 
                    </select>
                  </div>
                  <label for="inputPassword4" class="form-label labelInputs">Mensaje</label>
                  <div class="form-floating">                    
                    <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea2" style="height: 100px"></textarea>
                    <label for="floatingTextarea2" class="labelInputs">Deje sus mensaje aqui</label>
                  </div>
                  <div class="col-12">
                  </div>
                  <div class="col-12">
                    <button type="submit" class="btn btn-warning" id="boton">Enviar</button>
                  </div>
                </form>
              </div>
            </div>
            <div class="col-sm"></div>
          </div>
        </div>
      </section>
    </main>
    <footer>
          <div class="card text-center">
            <div class="card-body" id="footer-id">
              <h5 class="card-title">Plaza Sabores</h5>
              <p class="card-text">
                Ubicacion: Calle falsa 123 || Telefono: 019489483700
              </p>
              <a href="./contactenos.html" class="btn btn-warning">Contactenos</a>
            </div>
          </div>
        </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
